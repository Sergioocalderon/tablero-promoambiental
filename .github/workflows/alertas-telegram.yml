name: Alertas a Telegram

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Nunca dos corridas a la vez (2026-10-05): comparten estado (telegram_estado.json y el
# de la vigilancia DPF) y dos en paralelo podrian avisar lo mismo dos veces.
concurrency:
  group: alertas-telegram
  cancel-in-progress: false

jobs:
  revisar-y-notificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install mygeotab pandas requests reportlab python-dotenv

      - name: Restaurar estado de notificaciones ya enviadas
        uses: actions/cache/restore@v4
        with:
          path: telegram_estado.json
          key: telegram-estado-${{ github.run_id }}
          restore-keys: |
            telegram-estado-

      - run: python telegram_alertas.py
        env:
          GEOTAB_USUARIO: ${{ secrets.GEOTAB_USUARIO }}
          GEOTAB_CONTRASENA: ${{ secrets.GEOTAB_CONTRASENA }}
          GEOTAB_DATABASE: ${{ secrets.GEOTAB_DATABASE }}
          GEOTAB_SERVER: ${{ secrets.GEOTAB_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar estado de notificaciones para la proxima corrida
        if: always()
        uses: actions/cache/save@v4
        with:
          path: telegram_estado.json
          key: telegram-estado-${{ github.run_id }}

      # --- Vigilancia de regeneracion DPF (2026-10-05) ---------------------------
      # Va aqui y no solo en su propio workflow porque este se dispara de forma
      # confiable cada 5 min desde afuera (workflow_dispatch); el cron de GitHub de
      # vigilancia-regeneracion-dpf.yml casi no corria. Mismo estado (cache
      # vigilancia-dpf-), asi que continua donde quedo. continue-on-error: si la
      # vigilancia falla, el resto de este workflow no se entera.
      - name: Restaurar estado e historico de la vigilancia DPF
        if: always()
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            herramientas/estado_cumplimiento_regeneracion.json
            herramientas/historico_cumplimiento_regeneracion.csv
          key: vigilancia-dpf-${{ github.run_id }}
          restore-keys: |
            vigilancia-dpf-

      - name: Un ciclo de vigilancia DPF
        if: always()
        continue-on-error: true
        working-directory: herramientas
        run: python vigilancia_cumplimiento_regeneracion.py --una-vez --dias-backfill 13
        env:
          GEOTAB_USUARIO: ${{ secrets.GEOTAB_USUARIO }}
          GEOTAB_CONTRASENA: ${{ secrets.GEOTAB_CONTRASENA }}
          GEOTAB_DATABASE: ${{ secrets.GEOTAB_DATABASE }}
          GEOTAB_SERVER: ${{ secrets.GEOTAB_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar estado e historico de la vigilancia DPF
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            herramientas/estado_cumplimiento_regeneracion.json
            herramientas/historico_cumplimiento_regeneracion.csv
          key: vigilancia-dpf-${{ github.run_id }}

      - name: Publicar historico de la vigilancia DPF como artefacto
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: historico-cumplimiento-regeneracion
          path: herramientas/historico_cumplimiento_regeneracion.csv
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true

      - name: Limpiar caches viejos de la vigilancia DPF
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IDS_A_BORRAR=$(gh cache list --key vigilancia-dpf- --limit 100 --json id,createdAt \
            | jq -r 'sort_by(.createdAt) | reverse | .[1:][] | .id')
          for id in $IDS_A_BORRAR; do
            gh cache delete "$id" || echo "  -> ya no existia: $id"
          done

      - name: Limpiar caches viejos de estado (evita acumulacion indefinida)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Caches con prefijo telegram-estado- encontradas:"
          gh cache list --key telegram-estado- --limit 100 --json id,createdAt,key

          IDS_A_BORRAR=$(gh cache list --key telegram-estado- --limit 100 --json id,createdAt \
            | jq -r 'sort_by(.createdAt) | reverse | .[1:][] | .id')

          if [ -z "$IDS_A_BORRAR" ]; then
            echo "No hay caches viejas que borrar (0 o 1 encontradas)."
          else
            echo "Borrando caches viejas (un 'ya no existia' es normal si otra corrida en paralelo se adelanto):"
            for id in $IDS_A_BORRAR; do
              gh cache delete "$id" || echo "  -> ya no existia: $id (probablemente borrada por otra corrida en paralelo)"
            done
          fi
