name: Keep Streamlit App Awake

# SUSPENDIDO (2026-10-05, pedido del usuario): el tablero Streamlit ya no se
# usa -- su add-in se desmontó de Copiloto el mismo día. Se quita la
# programación cada 6 h para que la app quede dormida; se deja el disparo
# manual por si algún día hay que despertarla. Para reactivar, volver a
# agregar bajo "on:"   schedule: - cron: '0 */6 * * *'
on:
  workflow_dispatch:

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python keep_alive.py
